services:
  postgres:
    image: postgres:16
    container_name: amp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nandu@123
      POSTGRES_DB: academic_monitoring_db
    ports:
      - "5432:5432"
    volumes:
      - amp_pgdata:/var/lib/postgresql/data
      - ./database/postgresql_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  amp_pgdata:
